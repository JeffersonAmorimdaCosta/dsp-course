name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /dsp-course
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Show tool versions
        run: |
          python --version
          node --version
          npm --version
          jupyter-book --version

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended \
            texlive-latex-extra latexmk

      - name: Build static HTML site
        run: jupyter-book build --html --ci

      - name: Build study PDFs
        run: |
          mkdir -p _build/html/pdfs
          jupyter-book build estudo_1/relatorio_estudo_1.md --pdf --force --ci \
            --output _build/html/pdfs/estudo_1.pdf

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
      